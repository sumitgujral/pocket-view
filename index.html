<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket View - Movie Search & Recommendations</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🎬 Pocket View</h1>
            <p class="tagline">Your personal movie search and recommendation engine</p>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search for movies..." />
                <button id="searchBtn">Search</button>
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="popular">Popular</button>
                <button class="filter-btn" data-filter="top_rated">Top Rated</button>
                <button class="filter-btn" data-filter="upcoming">Upcoming</button>
            </div>
        </section>

        <section id="recommendations" class="section">
            <h2>Recommended Movies</h2>
            <div id="recommendedMovies" class="movies-grid">
                <!-- Movies will be loaded here -->
            </div>
        </section>

        <section id="searchResults" class="section hidden">
            <h2>Search Results</h2>
            <div id="searchMovies" class="movies-grid">
                <!-- Search results will be loaded here -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Pocket View. Movie data provided by <a href="https://www.themoviedb.org/" target="_blank">TMDB</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
